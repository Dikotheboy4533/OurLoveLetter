<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Polaroid Wall</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      font-family:'Poppins', sans-serif;
      background:linear-gradient(to bottom,#fdfcfb,#e2d1c3);
      color:#333;
    }
    header {
      text-align:center;
      padding:60px 20px;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      color:white;
    }
    header h1 {
      font-family:'Great Vibes', cursive;
      font-size:3em;
      text-shadow:0 0 15px pink;
    }
    .polaroid-wall {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:25px;
      padding:40px;
    }
    .polaroid {
      background:white;
      padding:10px 10px 25px 10px;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
      border:1px solid #ddd;
      width:180px;
      text-align:center;
      font-family:'Great Vibes', cursive;
      font-size:1em;
      color:#444;
      transform:rotate(-3deg);
      transition:transform 0.3s ease;
    }
    .polaroid:nth-child(even) { transform:rotate(3deg); }
    .polaroid:hover { transform:scale(1.05) rotate(0deg); }
    .polaroid img {
      width:100%;
      height:auto;
      filter:contrast(1.1) saturate(0.9) brightness(1.05);
      border-bottom:1px solid #ccc;
      margin-bottom:10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Our Polaroid Wall 📸</h1>
    <p>Snapshots pinned with love</p>
  </header>

  <div class="polaroid-wall">
    <div class="polaroid"><img src="images/polaroid1.jpg"><p>Memory 1</p></div>
    <div class="polaroid"><img src="images/polaroid2.jpg"><p>Memory 2</p></div>
    <div class="polaroid"><img src="images/polaroid3.jpg"><p>Memory 3</p></div>
    <div class="polaroid"><img src="images/polaroid4.jpg"><p>Memory 4</p></div>
    <div class="polaroid"><img src="images/polaroid5.jpg"><p>Memory 5</p></div>
    <div class="polaroid"><img src="images/polaroid6.jpg"><p>Memory 6</p></div>
    <div class="polaroid"><img src="images/polaroid7.jpg"><p>Memory 7</p></div>
    <div class="polaroid"><img src="images/polaroid8.jpg"><p>Memory 8</p></div>
    <div class="polaroid"><img src="images/polaroid9.jpg"><p>Memory 9</p></div>
    <div class="polaroid"><img src="images/polaroid10.jpg"><p>Memory 10</p></div>
    <div class="polaroid"><img src="images/polaroid11.jpg"><p>Memory 11</p></div>
    <div class="polaroid"><img src="images/polaroid12.jpg"><p>Memory 12</p></div>
    <div class="polaroid"><img src="images/polaroid13.jpg"><p>Memory 13</p></div>
    <div class="polaroid"><img src="images/polaroid14.jpg"><p>Memory 14</p></div>
    <div class="polaroid"><img src="images/polaroid15.jpg"><p>Memory 15</p></div>
  </div>

</body>
</html>
