<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Constellation of Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      overflow:hidden;
      background:black;
      font-family:'Poppins', sans-serif;
      color:white;
      cursor:url('images/heart-cursor.png'), auto;
    }

    canvas {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      z-index:-1;
    }

    /* Intro Splash */
    #intro {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:radial-gradient(circle at center, #ff9a9e, #fad0c4);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:white;
      font-family:'Great Vibes', cursive;
      font-size:2em;
      z-index:9999;
      animation: fadeOut 4s ease forwards;
      animation-delay:3s;
    }
    #intro h1 {
      font-size:3em;
      text-shadow:0 0 25px pink;
      animation: glow 3s infinite alternate;
    }
    #intro p {
      margin-top:20px;
      font-size:1.2em;
    }
    @keyframes fadeOut { to { opacity:0; visibility:hidden; } }
    @keyframes glow { from { text-shadow:0 0 15px pink; } to { text-shadow:0 0 35px red; } }

    .star {
      position:absolute;
      width:10px; height:10px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 15px #fff;
      cursor:pointer;
      animation:pulse 3s infinite ease-in-out;
      transition:transform 0.3s ease;
    }
    .star:hover { transform:scale(1.4); }
    @keyframes pulse {
      0% { opacity:0.6; }
      50% { opacity:1; }
      100% { opacity:0.6; }
    }

    .memory {
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(255,255,255,0.95);
      color:#d6336c;
      padding:25px;
      border-radius:20px;
      border:2px solid pink;
      box-shadow:0 0 40px rgba(255,100,150,0.6);
      font-family:'Great Vibes', cursive;
      font-size:1.6em;
      text-align:center;
      display:none;
      z-index:10;
      max-width:500px;
      animation:fadeIn 0.8s ease;
    }
    .memory img {
      width:100%;
      border-radius:15px;
      margin-bottom:15px;
      box-shadow:0 0 20px rgba(255,100,150,0.4);
    }
    @keyframes fadeIn {
      from{opacity:0; transform:translate(-50%,-55%);}
      to{opacity:1; transform:translate(-50%,-50%);}
    }

    /* Surprise hearts */
    .heart {
      position:fixed;
      font-size:2em;
      color:rgba(255,182,193,0.8);
      animation:floatUp 3s ease forwards;
      text-shadow:0 0 15px pink;
    }
    @keyframes floatUp {
      from { transform:translateY(0); opacity:1; }
      to { transform:translateY(-200px); opacity:0; }
    }
  </style>
</head>
<body>

  <!-- Intro Splash -->
  <div id="intro">
    <h1>🌌 Our Constellation of Memories 🌌</h1>
    <p>Every star holds a piece of us...</p>
  </div>

  <canvas id="sky"></canvas>

  <!-- Example Stars (add all 20) -->
  <div class="star" style="top:15%; left:20%;" onclick="showMemory('memory1')"></div>
  <div class="star" style="top:25%; left:40%;" onclick="showMemory('memory2')"></div>
  <!-- ... continue all 20 stars ... -->

  <!-- Surprise star -->
  <div class="star" style="top:50%; left:50%;" onclick="surpriseStar()"></div>

  <!-- Memory Popups -->
  <div id="memory1" class="memory"><img src="images/memory1.jpg">Our first late-night call 🌙</div>
  <div id="memory2" class="memory"><img src="images/memory2.jpg">The day you made me laugh endlessly 💫</div>
  <!-- ... continue memory3 through memory20 ... -->

  <script>
    // Starry background
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for(let i=0;i<3000;i++){
      stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.5,
      });
    }

    function drawStars(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="white";
      for(let i=0;i<stars.length;i++){
        ctx.beginPath();
        ctx.arc(stars[i].x,stars[i].y,stars[i].r,0,Math.PI*2,true);
        ctx.fill();
      }
    }

    function twinkle(){
      for(let i=0;i<stars.length;i++){
        stars[i].r = Math.random()*1.5;
      }
    }

    setInterval(drawStars,50);
    setInterval(twinkle,1000);

    // Memory popups
    let currentMemory=null;
    function showMemory(id){
      if(currentMemory){ document.getElementById(currentMemory).style.display='none'; }
      document.getElementById(id).style.display='block';
      currentMemory=id;
    }

    // Surprise star
    function surpriseStar(){
      for(let i=0;i<10;i++){
        const heart=document.createElement('div');
        heart.className='heart';
        heart.style.left=Math.random()*window.innerWidth+'px';
        heart.style.top=window.innerHeight+'px';
        heart.innerHTML='❤️';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),3000);
      }
    }

    // Resize canvas
    window.addEventListener('resize',()=>{
      canvas.width=window.innerWidth;
      canvas.height=window.innerHeight;
    });
  </script>

</body>
</html>
