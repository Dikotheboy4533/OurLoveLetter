<!DOCTYPE html>

<style>
/* =========================================================
   RESET

* {

}

html,

/* =========================================================

========================================================= */

.intro {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(150, 90, 255, 0.22),
            transparent 32%
        ),

            135deg,

.intro.hidden {

}

    padding: 30px;

    animation:

}

.intro-small {

        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(

.intro-subtitle {

.intro-heart {

.intro-heart::before,
.intro-heart::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    background: inherit;
}

.intro-heart::before {
    left: -5.5px;
}

.intro-heart::after {
    top: -5.5px;
}

@keyframes introAppear {
    from {
        opacity: 0;

#universe {

/* =========================================================
   CANVAS STARS
========================================================= */

#starCanvas {

    inset: 0;

    height: 100%;

}


/* =========================================================
   TITLE
========================================================= */

.sky-title {
    position: absolute;

    pointer-events: none;

.sky-title-main {

        Georgia,

.sky-title-sub {

/* =========================================================
   MEMORY STARS
========================================================= */

.interactive-star {
    position: absolute;

    width: 42px;
    height: 42px;

    transform:
        translate(-50%, -50%);

    border: 0;

    background: transparent;

    cursor: none;

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform .3s ease;
}

.interactive-star::before {
    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #f6e8ff 30%,
            #c9a7ff 70%,
            transparent 100%
        );

    box-shadow:
        0 0 5px #fff,
        0 0 12px #d9baff,
        0 0 24px rgba(165,118,255,.8),
        0 0 40px rgba(125,76,255,.38);

    animation:
        starPulse var(--pulse)
        ease-in-out infinite;

    animation-delay:
        var(--delay);
}

.interactive-star::after {
    content: "";

    position: absolute;

    width: 29px;
    height: 29px;

    opacity: .4;

    background:
        linear-gradient(
            90deg,
            transparent 47%,
            rgba(220,194,255,.9) 50%,
            transparent 53%
        ),
        linear-gradient(
            0deg,
            transparent 47%,
            rgba(220,194,255,.9) 50%,
            transparent 53%
        );

    filter: blur(.4px);

    animation:
        starPulse var(--pulse)
        ease-in-out infinite;

    animation-delay:
        var(--delay);
}

.interactive-star:hover {
    transform:
        translate(-50%, -50%)
        scale(1.32);
}

@keyframes starPulse {
    0%, 100% {
        opacity: .65;

        filter:
            brightness(.95);
    }

    50% {
        opacity: 1;

        filter:
            brightness(1.45);
    }
}

   CENTER SURPRISE STAR
========================================================= */

.surprise-star::before {

.surprise-star::after {

.cursor-heart::before {

/* =========================================================

========================================================= */

.heart-particle {

.heart-particle::before,

.heart-particle::after {

@keyframes heartFloat {

.memory-text {

.close-memory {

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        cursor: auto;
    }

    #customCursor {
        display: none;
    }

/* =========================================================

========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,

    *::after {

            .001ms !important;

        transition-duration:
            .001ms !important;
    }

</style>
</head>

<script>
/* =========================================================
   MEMORY DATA
========================================================= */

const memories = [

    },

    {

    },
   
    {

    },

    {
        title: "The Future",
        text: "To a future together..",
        art: "images/future.jpg"
    },

    {
        title: "My Safe place",
        text: "In you, I found my peace..",
        art: "safe"
    },

    {
        title: "A Thousand Little Reasons",
        text: "I could list a million reasons I love you and the million things I love about you..",
        art: "reasons"
    },

    {
        title: "Almost Forever",
        text: "Just three weeks, yet feels like we've known each other for a lifetime...",
        art: "forever"
    },

    {
        title: "Music",
        text: "They say, music is a form of love. Well, now I know what they meant..",
        art: "images/music.jpg"
    }

];


/* =========================================================
   DOM
========================================================= */

const universe =
    document.getElementById("universe");

const canvas =
    document.getElementById("starCanvas");

const ctx =
    canvas.getContext("2d");

const overlay =
    document.getElementById("memoryOverlay");

const memoryImage =
    document.getElementById("memoryImage");

const memoryNumber =
    document.getElementById("memoryNumber");

const memoryTitle =
    document.getElementById("memoryTitle");

const memoryText =
    document.getElementById("memoryText");

const closeMemory =
    document.getElementById("closeMemory");

const centerHint =
    document.getElementById("centerHint");

const intro =
    document.getElementById("intro");

const customCursor =
    document.getElementById("customCursor");


/* =========================================================
   CUSTOM CURSOR
========================================================= */

let mouseX = -100;
let mouseY = -100;

let cursorX = -100;
let cursorY = -100;

document.addEventListener(
    "mousemove",
    event => {

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;
    }
);


function animateCursor() {

    cursorX +=
        (mouseX - cursorX) * .28;

    cursorY +=
        (mouseY - cursorY) * .28;

    customCursor.style.left =
        `${cursorX}px`;

    customCursor.style.top =
        `${cursorY}px`;

    requestAnimationFrame(
        animateCursor
    );
}

animateCursor();


document.addEventListener(
    "mouseover",
    event => {

        if (
            event.target.closest(
                ".interactive-star, .close-memory"
            )
        ) {
            customCursor.classList.add(
                "active"
            );
        }

    }
);


document.addEventListener(
    "mouseout",
    event => {

        if (
            event.target.closest(
                ".interactive-star, .close-memory"
            )
        ) {
            customCursor.classList.remove(
                "active"
            );
        }

    }
);


/* =========================================================
   STABLE RANDOM
========================================================= */

let seed = 879124;

function random() {

    seed =
        (seed * 1664525 + 1013904223)
        >>> 0;

    return seed / 4294967296;
}


/* =========================================================
   BACKGROUND STAR SYSTEM
========================================================= */

const STAR_COUNT = 1100;

const backgroundStars = [];

let canvasWidth = 0;
let canvasHeight = 0;


function createBackgroundStars() {

    backgroundStars.length = 0;

    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        backgroundStars.push({

            x: random(),

            y: random(),

            radius:
                random() < .92
                    ? random() * .95 + .35
                    : random() * 1.5 + .85,

            opacity:
                random() * .5 + .2,

            phase:
                random() *
                Math.PI *
                2,

            speed:
                .00025 +
                random() * .0006

        });

    }
}


function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.4
        );

    canvasWidth =
        window.innerWidth;

    canvasHeight =
        window.innerHeight;

    canvas.width =
        Math.floor(
            canvasWidth * dpr
        );

    canvas.height =
        Math.floor(
            canvasHeight * dpr
        );

    canvas.style.width =
        `${canvasWidth}px`;

    canvas.style.height =
        `${canvasHeight}px`;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


function drawBackgroundStars(time) {

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    for (
        let i = 0;
        i < backgroundStars.length;
        i++
    ) {

        const star =
            backgroundStars[i];

        const twinkle =
            Math.sin(
                time * star.speed +
                star.phase
            );

        const opacity =
            Math.max(
                .06,
                Math.min(
                    .9,
                    star.opacity +
                    twinkle * .12
                )
            );

        const x =
            star.x *
            canvasWidth;

        const y =
            star.y *
            canvasHeight;

        ctx.globalAlpha =
            opacity;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        drawBackgroundStars
    );
}

function createHeartExplosion() {

    centerHint.classList.add(
        "hidden"
    );

    const rect =
        surpriseStar.getBoundingClientRect();

    const originX =
        rect.left +
        rect.width / 2;

    const originY =
        rect.top +
        rect.height / 2;

    const count = 34;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const heart =
            document.createElement(
                "span"
            );

        heart.className =
            "heart-particle";


        heart.style.left =
            `${originX}px`;

        heart.style.top =
            `${originY}px`;


        const angle =
            Math.random()
            * Math.PI
            * 2;

        const distance =
            45 +
            Math.random() * 120;

        const drift =
            Math.cos(angle)
            * distance;

        const rise =
            110 +
            Math.random() * 230;

        const scale =
            .4 +
            Math.random() * .9;

        const duration =
            1.9 +
            Math.random() * 1.6;


        heart.style.setProperty(
            "--drift",
            `${drift}px`
        );

        heart.style.setProperty(
            "--rise",
            `${rise}px`
        );

        heart.style.setProperty(
            "--scale",
            scale
        );

        heart.style.setProperty(
            "--float-time",
            `${duration}s`
        );


        heart.style.animationDelay =
            `${Math.random() * .25}s`;


        document.body.appendChild(
            heart
        );


        setTimeout(
            () =>
                heart.remove(),
            (duration + .5)
            * 1000
        );

    }
}
