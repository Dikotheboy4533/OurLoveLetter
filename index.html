<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Love Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      font-family:'Poppins', sans-serif;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      color:#333;
      overflow-x:hidden;
    }

    header {
      text-align:center;
      padding:80px 20px;
      color:white;
    }
    header h1 {
      font-family:'Great Vibes', cursive;
      font-size:3.5em;
      text-shadow:0 0 20px pink;
      animation: glow 3s infinite alternate;
    }
    header p {
      font-size:1.3em;
      margin-top:20px;
    }

    /* Envelope */
    .envelope {
      width:320px;
      height:220px;
      background:#fff;
      margin:60px auto;
      position:relative;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
      transition:transform 0.5s;
      border-radius:6px;
    }
    .envelope:hover { transform:scale(1.05); }
    .flap {
      position:absolute;
      top:0; left:0;
      width:0; height:0;
      border-left:160px solid transparent;
      border-right:160px solid transparent;
      border-bottom:110px solid #ff6f91;
      transition:transform 1s;
      transform-origin:top;
    }
    .letter {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:#fff;
      padding:25px;
      box-sizing:border-box;
      opacity:0;
      transition:opacity 1s;
      font-family:'Great Vibes', cursive;
      font-size:1.6em;
      line-height:1.6em;
      color:#d6336c;
      border-radius:6px;
    }
    .envelope.open .flap { transform:rotateX(180deg); }
    .envelope.open .letter { opacity:1; }

    /* Glow animation */
    @keyframes glow { from{text-shadow:0 0 10px pink;} to{text-shadow:0 0 30px red;} }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 1.4em;
      animation: rise linear forwards;
      opacity: 0.7;
      color: #ff4d6d;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity:0; }
      10% { opacity:1; }
      100% { transform: translateY(-110vh); opacity:0; }
    }

    /* Typewriter effect */
    .typewriter {
      overflow:hidden;
      border-right:.15em solid #d6336c;
      white-space:nowrap;
      margin:0 auto;
      letter-spacing:.05em;
      animation: typing 5s steps(40,end), blink-caret .75s step-end infinite;
    }
    @keyframes typing { from { width:0 } to { width:100% } }
    @keyframes blink-caret { from, to { border-color:transparent } 50% { border-color:#d6336c; } }
  </style>
</head>
<body>

  <header>
    <h1>💌 My Love Letter 💌</h1>
    <p>Click the envelope to open...</p>
  </header>

  <!-- Envelope -->
  <div class="envelope" onclick="this.classList.toggle('open')">
    <div class="flap"></div>
    <div class="letter">
      <div class="typewriter">
        My dearest,<br><br>
        Every day apart feels long, but every memory brings me closer to you.<br>
        You are my safe place, my brightest smile, my forever.<br><br>
        No matter the path, it always leads to you.<br><br>
        Yours always,<br>
        ❤️ Jack
      </div>
    </div>
  </div>

  <!-- Floating hearts -->
  <script>
    function createHeart(){
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤️';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = (4 + Math.random()*4) + 's';
      document.body.appendChild(heart);
      setTimeout(()=>{ heart.remove(); }, 8000);
    }
    setInterval(createHeart, 1500);
  </script>

</body>
</html>
