<style>

   RESET
========================================================= */

        radial-gradient(

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {

    padding: 30px;

        introAppear 1.6s cubic-bezier(.2,.8,.2,1);
}

.intro-small {
    font-size: 11px;
    letter-spacing: .42em;

        );

    -webkit-background-clip: text;
    background-clip: text;

        drop-shadow(

.intro-subtitle {

.intro-heart::after {

@keyframes introAppear {

   UNIVERSE

#universe {

            transparent 45%

/*
   IMPORTANT PERFORMANCE CHANGE:

   Instead of 1,700 HTML elements, all background
   stars are rendered into ONE canvas.
*/

#starCanvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   TITLE
========================================================= */

.sky-title {
    position: absolute;

}

.sky-title-main {

        Georgia,

/* =========================================================
   INTERACTIVE STARS
========================================================= */

.interactive-star {
    position: absolute;

    width: 38px;
    height: 38px;

    transform:
        translate(-50%, -50%);

    border: 0;

    background: transparent;

    cursor: pointer;

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform .3s ease;
}

.interactive-star::before {
    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #f4e7ff 35%,
            #c6a2ff 70%,
            transparent 100%
        );

    box-shadow:
        0 0 5px #fff,
        0 0 12px #d9baff,
        0 0 25px rgba(165,118,255,.85),
        0 0 42px rgba(125,76,255,.45);

    animation:
        starPulse var(--pulse)
        ease-in-out infinite;

    animation-delay:
        var(--delay);
}

.interactive-star::after {
    content: "";

    position: absolute;

    width: 27px;
    height: 27px;

    opacity: .4;

    background:
        linear-gradient(
            90deg,
            transparent 47%,
            rgba(220,194,255,.8) 50%,
            transparent 53%
        ),
        linear-gradient(
            0deg,
            transparent 47%,
            rgba(220,194,255,.8) 50%,
            transparent 53%
        );

    filter: blur(.5px);

    animation:
        starPulse var(--pulse)
        ease-in-out infinite;

    animation-delay:
        var(--delay);
}

.interactive-star:hover {
    transform:
        translate(-50%, -50%)
        scale(1.35);
}

@keyframes starPulse {

    0%, 100% {
        opacity: .65;
        filter: brightness(.9);
    }

    50% {
        opacity: 1;
        filter: brightness(1.45);
    }
}


/* =========================================================
   SURPRISE STAR
========================================================= */

.surprise-star {

    z-index: 30;

.surprise-star::before {

.heart-particle {

    height: 12px;

    transform: rotate(45deg);

    pointer-events: none;

.heart-particle::before,
.heart-particle::after {
    content: "";

    height: 12px;

.heart-particle::before {
    left: -6px;

.heart-particle::after {
    top: -6px;

@keyframes heartFloat {

    0% {
        opacity: 0;

        transform:

            rotate(45deg)
            scale(.45);

    12% {

.memory-card {

/* =========================================================

@media (max-width: 600px) {

</head>

<script>
/* =========================================================
   MEMORY DATA
========================================================= */

const memories = [

    {
        title: "The Beginning",
        text: "Some stories begin quietly. Ours began with a moment that seemed ordinary at the time, but somehow became the beginning of everything.",
        art: "beginning"
    },

    {
        title: "That First Smile",
        text: "I still remember the feeling of seeing your smile and realizing that there was something about you I wanted to know more about.",
        art: "smile"
    },

    {
        title: "Our First Adventure",
        text: "It didn't have to be somewhere extraordinary. Being there with you was enough to turn an ordinary day into something worth remembering.",
        art: "adventure"
    },

    {
        title: "The Little Things",
        text: "The tiny things became my favorite things: your expressions, your laugh, the way you say certain words, and all the little moments in between.",
        art: "little"
    },

    {

    {

        art: "laugh"
    },

    {
        title: "Our Secret Language",
        text: "Over time, we created a language made from looks, tiny jokes, expressions and moments that only the two of us understand.",
        art: "language"
    },

    {
        title: "When I Knew",
        text: "There was a moment when I stopped wondering where this story was going and simply knew that I wanted you to be part of the chapters ahead.",
        art: "knew"
    },

    {
        title: "Your Hand in Mine",

    },

    {
        title: "Our Favorite Place",
        text: "Maybe our favorite place isn't really a place at all. Maybe it's simply wherever we happen to be together.",
        art: "place"
    },

    {
        title: "The Unexpected Moments",
        text: "The plans we didn't make often became the memories we treasure most. Life seems to have a funny way of giving us beautiful surprises.",
        art: "unexpected"
    },

    {
        title: "You Make Home",
        text: "Home became less about a location and more about a feeling — and somehow, that feeling always seems to find me when I'm with you.",
        art: "home"
    },

    {
        title: "The Quiet Moments",
        text: "Not every beautiful memory needs a grand story. Some of the most precious ones are simply us sitting together, comfortable in the silence.",
        art: "quiet"
    },

    {
        title: "Still My Favorite Person",
        text: "After every conversation, every laugh, every little disagreement and every adventure, you're still the person I want to tell everything to.",
        art: "favorite"
    },

    {
        title: "The Future",
        text: "There are so many places we haven't seen, mornings we haven't woken up to, meals we haven't shared and memories we haven't made yet.",
        art: "future"
    },

    {
        title: "Every Version of Us",
        text: "We've changed, grown and learned along the way. And somehow every version of us has brought me closer to the person you are today.",
        art: "versions"
    },

    {
        title: "My Safe Place",
        text: "With you, I can be completely myself. No performance, no pretending — just me, exactly as I am.",
        art: "safe"
    },

    {

        text: "I could try to list every reason I love you, but I'd eventually run out of words. So I'll spend my life showing you instead.",
        art: "reasons"
    },

    {
        title: "Almost Forever",
        text: "We've already collected so many memories, and somehow the thought that we're only at the beginning makes me smile.",
        art: "forever"
    },

    {
        title: "My Favorite Chapter",
        text: "Of all the places this story could have taken me, I'm grateful it brought me here — to you. And I can't wait for everything still ahead.",
        art: "chapter"
    }

];


/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById("starCanvas");

const ctx =
    canvas.getContext("2d");

const starsContainer =
    document.getElementById("universe");

const overlay =
    document.getElementById("memoryOverlay");

const memoryImage =
    document.getElementById("memoryImage");

const memoryNumber =
    document.getElementById("memoryNumber");

const memoryTitle =
    document.getElementById("memoryTitle");

const memoryText =
    document.getElementById("memoryText");

const closeMemory =
    document.getElementById("closeMemory");

const centerHint =
    document.getElementById("centerHint");

const intro =
    document.getElementById("intro");


/* =========================================================
   STABLE RANDOM GENERATOR
========================================================= */

let seed = 918273;

function random() {

    seed =
        (seed * 1664525 + 1013904223)
        >>> 0;

    return seed / 4294967296;
}


/* =========================================================
   BACKGROUND STARS
=========================================================

   These are NOT DOM elements.

   The canvas contains all 1,700 stars in one drawing layer.
========================================================= */

const STAR_COUNT = 1700;

const backgroundStars = [];

function createStars() {

    backgroundStars.length = 0;

    for (let i = 0; i < STAR_COUNT; i++) {

        backgroundStars.push({

            x: random(),

            y: random(),

            radius:
                random() < .92
                    ? random() * 1.2 + .35
                    : random() * 1.7 + 1,

            opacity:
                random() * .45 + .25,

            /*
               Each star gets its own phase and speed,
               but NEVER changes its position.
            */

            phase:
                random() * Math.PI * 2,

            speed:
                .0005 + random() * .0012

        });

    }
}


/* =========================================================
   CANVAS RESIZE
========================================================= */

let canvasWidth = 0;
let canvasHeight = 0;

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    canvasWidth =
        window.innerWidth;

    canvasHeight =
        window.innerHeight;

    canvas.width =
        Math.floor(canvasWidth * dpr);

    canvas.height =
        Math.floor(canvasHeight * dpr);

    canvas.style.width =
        `${canvasWidth}px`;

    canvas.style.height =
        `${canvasHeight}px`;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

createStars();

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   DRAW BACKGROUND
========================================================= */

let animationFrame = null;

function drawStars(time) {

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );

    for (const star of backgroundStars) {

        /*
           Very cheap sine-based brightness pulse.

           x/y NEVER change.
        */

        const pulse =
            Math.sin(
                time * star.speed +
                star.phase
            );

        const opacity =
            Math.max(
                .08,
                Math.min(
                    1,
                    star.opacity +
                    pulse * .16
                )
            );

        const x =
            star.x * canvasWidth;

        const y =
            star.y * canvasHeight;

        ctx.globalAlpha =
            opacity;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    animationFrame =
        requestAnimationFrame(drawStars);
}

animationFrame =
    requestAnimationFrame(drawStars);


/* =========================================================
   INTERACTIVE STAR POSITIONS
========================================================= */

const positions = [

    [9, 17],
    [21, 31],
    [34, 13],
    [47, 24],
    [62, 14],

    [78, 22],
    [91, 14],
    [14, 51],
    [27, 65],
    [42, 47],

    [58, 55],
    [73, 45],
    [88, 57],
    [7, 78],
    [22, 87],

    [38, 78],
    [56, 82],
    [72, 74],
    [90, 84],
    [94, 38]

];


/* =========================================================
   CREATE MEMORY STARS
========================================================= */

positions.forEach(
    (position, index) => {

        const star =
            document.createElement("button");

        star.className =
            "interactive-star";

        star.setAttribute(
            "aria-label",
            `Open memory ${index + 1}`
        );

        star.style.left =
            `${position[0]}%`;

        star.style.top =
            `${position[1]}%`;

        star.style.setProperty(
            "--pulse",
            `${2.2 + (index % 4) * .55}s`
        );

        star.style.setProperty(
            "--delay",
            `${-(index * .37)}s`
        );

        star.addEventListener(
            "click",
            () => openMemory(index)
        );

        starsContainer.appendChild(star);
    }
);


/* =========================================================
   SURPRISE STAR
========================================================= */

const surpriseStar =
    document.createElement("button");

surpriseStar.className =
    "interactive-star surprise-star";

function openMemory(index) {

    const memory =
        memories[index];

    memoryImage.src =
        svgImage(
            memory.art,
            index
        );

    memoryImage.alt =
        `Cosmic artwork representing ${memory.title}`;

    memoryNumber.textContent =
        `Memory ${String(index + 1).padStart(2, "0")} · 20`;

    memoryTitle.textContent =
        memory.title;

    memoryText.textContent =
        memory.text;

    overlay.classList.add("open");
}


/* =========================================================
   CLOSE MEMORY
========================================================= */

function closeMemoryPopup() {

    overlay.classList.remove("open");
}

closeMemory.addEventListener(
    "click",
    closeMemoryPopup
);

overlay.addEventListener(
    "click",
    event => {

        if (
            event.target === overlay
        ) {
            closeMemoryPopup();
        }

    }
);

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {
            closeMemoryPopup();
        }

    }
);


/* =========================================================
   HEART EXPLOSION
========================================================= */

function createHeartExplosion() {

    centerHint.classList.add("hidden");

    const rect =
        surpriseStar.getBoundingClientRect();

    const originX =
        rect.left +
        rect.width / 2;

    const originY =
        rect.top +
        rect.height / 2;


    /*
       45 hearts instead of 55.
       This keeps the effect beautiful while reducing
       the temporary workload.
    */

    const count = 45;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const heart =
            document.createElement("span");

        heart.className =
            "heart-particle";

        heart.style.left =
            `${originX}px`;

        heart.style.top =
            `${originY}px`;


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            50 +
            Math.random() *
            150;

        const drift =
            Math.cos(angle) *
            distance;

        const rise =
            120 +
            Math.random() *
            280;

        const scale =
            .45 +
            Math.random() *
            1.1;

        const duration =
            2.1 +
            Math.random() *
            2.1;


        heart.style.setProperty(
            "--drift",
            `${drift}px`
        );

        heart.style.setProperty(
            "--rise",
            `${rise}px`
        );

        heart.style.setProperty(
            "--scale",
            scale
        );

        heart.style.setProperty(
            "--float-time",
            `${duration}s`
        );

        heart.style.animationDelay =
            `${Math.random() * .4}s`;


        document.body.appendChild(
            heart
        );


        setTimeout(
            () => heart.remove(),
            (duration + .6) * 1000
        );
    }
}
