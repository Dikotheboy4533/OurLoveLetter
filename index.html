<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Constellation of Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      overflow:hidden;
      background:black;
      font-family:'Poppins', sans-serif;
      color:white;
      cursor:url('images/heart-cursor.png'), auto; /* custom cursor */
    }

    canvas {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      z-index:-1;
    }

    /* Intro Splash */
    #intro {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:white;
      font-family:'Great Vibes', cursive;
      font-size:2em;
      z-index:9999;
      animation: fadeOut 4s ease forwards;
      animation-delay:3s;
    }
    #intro h1 {
      font-size:3em;
      text-shadow:0 0 20px pink;
      animation: glow 3s infinite alternate;
    }
    #intro p {
      margin-top:20px;
      font-size:1.2em;
    }
    @keyframes fadeOut { to { opacity:0; visibility:hidden; } }
    @keyframes glow { from { text-shadow:0 0 10px pink; } to { text-shadow:0 0 30px red; } }

    /* Aurora effect */
    #aurora {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:linear-gradient(135deg,rgba(0,255,200,0.2),rgba(255,0,200,0.2));
      animation:auroraMove 10s infinite alternate;
      z-index:-2;
    }
    @keyframes auroraMove {
      from { transform:translateX(-50px) translateY(-20px); }
      to { transform:translateX(50px) translateY(20px); }
    }

    .star {
      position:absolute;
      width:12px; height:12px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 20px #fff;
      cursor:pointer;
      animation:pulse 3s infinite ease-in-out;
      transition:transform 0.3s ease;
    }
    .star:hover { transform:scale(1.5); }
    @keyframes pulse {
      0% { opacity:0.6; }
      50% { opacity:1; }
      100% { opacity:0.6; }
    }

    .memory {
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(255,255,255,0.95);
      color:#d6336c;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 40px rgba(255,100,150,0.6);
      font-family:'Great Vibes', cursive;
      font-size:1.6em;
      text-align:center;
      display:none;
      z-index:10;
      max-width:500px;
      animation:fadeIn 0.8s ease;
    }
    .memory img {
      width:100%;
      border-radius:10px;
      margin-bottom:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
    }
    @keyframes fadeIn {
      from{opacity:0; transform:translate(-50%,-55%);}
      to{opacity:1; transform:translate(-50%,-50%);}
    }

    /* Surprise hearts */
    .heart {
      position:fixed;
      font-size:2em;
      color:pink;
      animation:floatUp 3s ease forwards;
    }
    @keyframes floatUp {
      from { transform:translateY(0); opacity:1; }
      to { transform:translateY(-200px); opacity:0; }
    }
  </style>
</head>
<body>

  <!-- Intro Splash -->
  <div id="intro">
    <h1>🌌 Our Constellation of Memories 🌌</h1>
    <p>Every star holds a piece of us...</p>
  </div>

  <div id="aurora"></div>
  <canvas id="sky"></canvas>

  <!-- 20 Clickable Stars -->
  <div class="star" style="top:15%; left:20%;" onclick="showMemory('memory1')"></div>
  <div class="star" style="top:25%; left:40%;" onclick="showMemory('memory2')"></div>
  <div class="star" style="top:35%; left:70%;" onclick="showMemory('memory3')"></div>
  <div class="star" style="top:50%; left:10%;" onclick="showMemory('memory4')"></div>
  <div class="star" style="top:60%; left:30%;" onclick="showMemory('memory5')"></div>
  <div class="star" style="top:75%; left:50%;" onclick="showMemory('memory6')"></div>
  <div class="star" style="top:20%; left:80%;" onclick="showMemory('memory7')"></div>
  <div class="star" style="top:40%; left:90%;" onclick="showMemory('memory8')"></div>
  <div class="star" style="top:65%; left:70%;" onclick="showMemory('memory9')"></div>
  <div class="star" style="top:85%; left:20%;" onclick="showMemory('memory10')"></div>
  <div class="star" style="top:10%; left:60%;" onclick="showMemory('memory11')"></div>
  <div class="star" style="top:30%; left:15%;" onclick="showMemory('memory12')"></div>
  <div class="star" style="top:55%; left:45%;" onclick="showMemory('memory13')"></div>
  <div class="star" style="top:70%; left:85%;" onclick="showMemory('memory14')"></div>
  <div class="star" style="top:90%; left:60%;" onclick="showMemory('memory15')"></div>
  <div class="star" style="top:12%; left:35%;" onclick="showMemory('memory16')"></div>
  <div class="star" style="top:28%; left:55%;" onclick="showMemory('memory17')"></div>
  <div class="star" style="top:48%; left:75%;" onclick="showMemory('memory18')"></div>
  <div class="star" style="top:68%; left:25%;" onclick="showMemory('memory19')"></div>
  <div class="star" style="top:88%; left:45%;" onclick="showMemory('memory20')"></div>

  <!-- Surprise star -->
  <div class="star" style="top:50%; left:50%;" onclick="surpriseStar()"></div>

  <!-- Memory Popups -->
  <div id="memory1" class="memory"><img src="images/memory1.jpg">Our first late-night call 🌙</div>
  <div id="memory2" class="memory"><img src="images/memory2.jpg">The day you made me laugh endlessly 💫</div>
  <div id="memory3" class="memory"><img src="images/memory3.jpg">That surprise message that lit up my day ✨</div>
  <!-- ... continue memory4 through memory20 as before ... -->

  <script>
    // Starry background
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for(let i=0;i<3000;i++){ // thousands of background stars
      stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.5,
      });
    }

    function drawStars(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="white";
      for(let i=0;i<stars.length;i++){
        ctx.beginPath();
        ctx.arc(stars[i].x,stars[i].y,stars[i].r,0,Math.PI*2,true);
        ctx.fill();
      }
      drawMeteors();
          }
    setInterval(spawnMeteor,5000);

    // Constellation lines (connect some clickable stars)
    function drawConstellations(){
      ctx.strokeStyle="rgba(255,200,200,0.5)";
      ctx.lineWidth=1.5;
      ctx.beginPath();
      // Example: connect star1 -> star2 -> star3
      ctx.moveTo(window.innerWidth*0.15,window.innerHeight*0.20);
      ctx.lineTo(window.innerWidth*0.25,window.innerHeight*0.40);
      ctx.lineTo(window.innerWidth*0.35,window.innerHeight*0.70);
      ctx.stroke();
    }

    // Memory popups
    let currentMemory=null;
    function showMemory(id){
      if(currentMemory){ document.getElementById(currentMemory).style.display='none'; }
      document.getElementById(id).style.display='block';
      currentMemory=id;
    }

    // Surprise star
    function surpriseStar(){
      for(let i=0;i<10;i++){
        const heart=document.createElement('div');
        heart.className='heart';
        heart.style.left=Math.random()*window.innerWidth+'px';
        heart.style.top=window.innerHeight+'px';
        heart.innerHTML='❤️';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),3000);
      }
    }

    // Resize canvas
    window.addEventListener('resize',()=>{
      canvas.width=window.innerWidth;
      canvas.height=window.innerHeight;
    });
  </script>

</body>
</html>
