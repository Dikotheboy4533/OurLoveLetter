<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Constellation of Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      overflow:hidden;
      background:black;
      font-family:'Poppins', sans-serif;
      color:white;
    }

    canvas {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      z-index:-1;
    }

    .star {
      position:absolute;
      width:10px; height:10px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 15px #fff;
      cursor:pointer;
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform:scale(1); opacity:0.7; }
      50% { transform:scale(1.4); opacity:1; }
      100% { transform:scale(1); opacity:0.7; }
    }

    .memory {
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(255,255,255,0.95);
      color:#d6336c;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 30px rgba(255,100,150,0.5);
      font-family:'Great Vibes', cursive;
      font-size:1.6em;
      text-align:center;
      display:none;
      z-index:10;
      max-width:500px;
      animation:fadeIn 1s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:translate(-50%,-60%);} to{opacity:1; transform:translate(-50%,-50%);} }

    /* Shooting stars */
    .shooting-star {
      position:fixed;
      width:2px; height:100px;
      background:linear-gradient(white, transparent);
      animation:shoot 2s linear forwards;
    }
    @keyframes shoot {
      from { transform:translate(0,0) rotate(45deg); opacity:1; }
      to { transform:translate(600px,600px) rotate(45deg); opacity:0; }
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <!-- Example stars with pictures -->
  <div class="star" style="top:20%; left:30%;" onclick="showMemory('memory1')"></div>
  <div class="star" style="top:40%; left:60%;" onclick="showMemory('memory2')"></div>
  <div class="star" style="top:70%; left:20%;" onclick="showMemory('memory3')"></div>
  <div class="star" style="top:55%; left:75%;" onclick="showMemory('memory4')"></div>
  <div class="star" style="top:30%; left:50%;" onclick="showMemory('memory5')"></div>

  <!-- Memory popups -->
  <div id="memory1" class="memory">
    <img src="images/memory1.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    Our first late-night call 🌙
  </div>
  <div id="memory2" class="memory">
    <img src="images/memory2.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    The day you made me laugh endlessly 💫
  </div>
  <div id="memory3" class="memory">
    <img src="images/memory3.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    That surprise message that lit up my day ✨
  </div>
  <div id="memory4" class="memory">
    <img src="images/memory4.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    Our shared playlist moment 🎶
  </div>
  <div id="memory5" class="memory">
    <img src="images/memory5.jpg" style="width:100%; border-radius:10px; margin-bottom:15px;">
    The promise we made under the stars ❤️
  </div>

  <script>
    // Starry background
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for(let i=0;i<1000;i++){ // thousands of stars
      stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.5,
      });
    }

    function drawStars(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="white";
      for(let i=0;i<stars.length;i++){
        ctx.beginPath();
        ctx.arc(stars[i].x,stars[i].y,stars[i].r,0,Math.PI*2,true);
        ctx.fill();
      }
    }

    function twinkle(){
      for(let i=0;i<stars.length;i++){
        stars[i].r = Math.random()*1.5;
      }
    }

    setInterval(drawStars,50);
    setInterval(twinkle,1000);

    // Shooting stars
    function createShootingStar(){
      const star=document.createElement('div');
      star.className='shooting-star';
      star.style.top=Math.random()*window.innerHeight+'px';
      star.style.left=Math.random()*window.innerWidth+'px';
      document.body.appendChild(star);
      setTimeout(()=>star.remove(),2000);
    }
    setInterval(createShootingStar,4000);

    // Memory popups
    let currentMemory=null;
    function showMemory(id){
      if(currentMemory){ document.getElementById(currentMemory).style.display='none'; }
      document.getElementById(id).style.display='block';
      currentMemory=id;
    }
  </script>

</body>
</html>
