<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Love Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      font-family:'Poppins', sans-serif;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .envelope {
      position:relative;
      width:350px;
      height:250px;
      background:#fff;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
      cursor:pointer;
      border-radius:6px;
      overflow:hidden;
    }

    .flap {
      position:absolute;
      top:0; left:0;
      width:0; height:0;
      border-left:175px solid transparent;
      border-right:175px solid transparent;
      border-bottom:125px solid #ff6f91;
      transition:transform 1s ease;
      transform-origin:top;
      z-index:2;
    }

    .letter {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:#fff;
      padding:25px;
      box-sizing:border-box;
      opacity:0;
      transition:opacity 1s ease;
      font-family:'Great Vibes', cursive;
      font-size:1.4em;
      line-height:1.6em;
      color:#d6336c;
      z-index:1;
    }

    .envelope.open .flap { transform:rotateX(180deg); }
    .envelope.open .letter { opacity:1; }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 1.4em;
      animation: rise linear forwards;
      opacity: 0.7;
      color: #ff4d6d;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity:0; }
      10% { opacity:1; }
      100% { transform: translateY(-110vh); opacity:0; }
    }
  </style>
</head>
<body>

  <!-- Envelope -->
  <div class="envelope" onclick="this.classList.toggle('open')">
    <div class="flap"></div>
    <div class="letter">
      My dearest,<br><br>
      Every day apart feels long, but every memory brings me closer to you.<br>
      You are my safe place, my brightest smile, my forever.<br><br>
      No matter the path, it always leads to you.<br><br>
      Yours always,<br>
      ❤️ Jack
    </div>
  </div>

  <!-- Floating hearts -->
  <script>
    function createHeart(){
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤️';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = (4 + Math.random()*4) + 's';
      document.body.appendChild(heart);
      setTimeout(()=>{ heart.remove(); }, 8000);
    }
    setInterval(createHeart, 1500);
  </script>

</body>
</html>
