<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Constellation of Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      overflow:hidden;
      background:black;
      font-family:'Poppins', sans-serif;
      color:white;
    }

    canvas {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      z-index:-1;
    }

    .star {
      position:absolute;
      width:12px; height:12px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 15px #fff;
      cursor:pointer;
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform:scale(1); opacity:0.8; }
      50% { transform:scale(1.3); opacity:1; }
      100% { transform:scale(1); opacity:0.8; }
    }

    .memory {
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(255,255,255,0.95);
      color:#d6336c;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 30px rgba(255,100,150,0.5);
      font-family:'Great Vibes', cursive;
      font-size:1.6em;
      text-align:center;
      display:none;
      z-index:10;
      max-width:400px;
    }
    .memory.show { display:block; animation:fadeIn 1s ease; }
    @keyframes fadeIn { from{opacity:0; transform:translate(-50%,-60%);} to{opacity:1; transform:translate(-50%,-50%);} }

    .close {
      margin-top:20px;
      font-size:0.6em;
      cursor:pointer;
      color:#333;
      font-family:'Poppins', sans-serif;
    }

    /* Shooting stars */
    .shooting-star {
      position:fixed;
      width:2px; height:80px;
      background:linear-gradient(white, transparent);
      animation:shoot 2s linear forwards;
    }
    @keyframes shoot {
      from { transform:translate(0,0) rotate(45deg); opacity:1; }
      to { transform:translate(400px,400px) rotate(45deg); opacity:0; }
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <!-- Stars with memories -->
  <div class="star" style="top:20%; left:30%;" onclick="showMemory(0)"></div>
  <div class="star" style="top:40%; left:60%;" onclick="showMemory(1)"></div>
  <div class="star" style="top:70%; left:20%;" onclick="showMemory(2)"></div>
  <div class="star" style="top:55%; left:75%;" onclick="showMemory(3)"></div>
  <div class="star" style="top:30%; left:50%;" onclick="showMemory(4)"></div>

  <!-- Memory popups -->
  <div id="memory0" class="memory">
    Our first late-night call 🌙
    <div class="close" onclick="closeMemory(0)">Close ✖</div>
  </div>
  <div id="memory1" class="memory">
    The day you made me laugh endlessly 💫
    <div class="close" onclick="closeMemory(1)">Close ✖</div>
  </div>
  <div id="memory2" class="memory">
    That surprise message that lit up my day ✨
    <div class="close" onclick="closeMemory(2)">Close ✖</div>
  </div>
  <div id="memory3" class="memory">
    Our shared playlist moment 🎶
    <div class="close" onclick="closeMemory(3)">Close ✖</div>
  </div>
  <div id="memory4" class="memory">
    The promise we made under the stars ❤️
    <div class="close" onclick="closeMemory(4)">Close ✖</div>
  </div>

  <script>
    // Starry background
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for(let i=0;i<200;i++){
      stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.5,
        d:Math.random()*canvas.height
      });
    }

    function drawStars(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="white";
      for(let i=0;i<stars.length;i++){
        ctx.beginPath();
        ctx.arc(stars[i].x,stars[i].y,stars[i].r,0,Math.PI*2,true);
        ctx.fill();
      }
    }

    function twinkle(){
      for(let i=0;i<stars.length;i++){
        stars[i].r = Math.random()*1.5;
      }
    }

    setInterval(drawStars,50);
    setInterval(twinkle,1000);

    // Shooting stars
    function createShootingStar(){
      const star=document.createElement('div');
      star.className='shooting-star';
      star.style.top=Math.random()*window.innerHeight+'px';
      star.style.left=Math.random()*window.innerWidth+'px';
      document.body.appendChild(star);
      setTimeout(()=>star.remove(),2000);
    }
    setInterval(createShootingStar,5000);

    // Memory popups
    function showMemory(i){
      document.getElementById('memory'+i).classList.add('show');
    }
    function closeMemory(i){
      document.getElementById('memory'+i).classList.remove('show');
    }
  </script>

</body>
</html>
